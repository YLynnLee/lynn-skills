name: flowmap

on:
  push:
    paths: ["skills/design/flowmap/**", ".github/workflows/flowmap.yml"]
  pull_request:
    paths: ["skills/design/flowmap/**", ".github/workflows/flowmap.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/design/flowmap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Nothing to install: Pele ships in vendor/pele/.
      - run: node scripts/doctor.mjs
      - run: npm test

  vendor:
    # vendor/pele/ must be byte for byte what npm publishes for the version in vendor/pele/VERSION.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/design/flowmap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run vendor:check
