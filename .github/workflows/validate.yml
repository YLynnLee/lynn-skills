name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python scripts/validate.py
